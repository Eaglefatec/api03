<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUSEX - Solicitação Médica</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 24px 16px;
    color: #222;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  h1 {
    font-size: 1.3em;
    margin-top: 0;
    color: #1a4d8f;
  }
  h2 {
    font-size: 1em;
    color: #555;
    margin-top: 24px;
  }
  .info p {
    margin: 6px 0;
    font-size: 0.95em;
  }
  .info strong { color: #444; }
  label {
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
    font-size: 0.9em;
    font-weight: 600;
    color: #444;
  }
  input[type=text], input[type=number], select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.95em;
    background: #fff;
  }
  select:disabled {
    background: #f4f5f7;
    color: #999;
  }
  .checkbox-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    font-size: 0.9em;
    font-weight: normal;
  }
  .checkbox-line input { width: auto; margin: 0; }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    background: #1a4d8f;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 1em;
    cursor: pointer;
  }
  button:hover { background: #143c70; }
  #loading { text-align: center; color: #888; padding: 20px 0; }
  #errorSection, #jaPreenchida {
    margin-top: 12px;
    padding: 12px;
    border-radius: 6px;
    font-size: 0.9em;
  }
  #errorSection {
    background: #fdecea;
    border: 1px solid #f3b4ac;
    color: #a02b1f;
  }
  #jaPreenchida {
    background: #fff6e0;
    border: 1px solid #f0d68a;
    color: #7a5c00;
  }
  #resultSection {
    margin-top: 16px;
    padding: 14px;
    background: #e7f6ec;
    border: 1px solid #a7dcb5;
    border-radius: 6px;
  }
  #resultSection h2 { margin-top: 0; color: #1f7a3d; }
  .opcao {
    background: #fff;
    border: 1px solid #cfe9d8;
    border-radius: 6px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 0.9em;
  }
  hr { border: none; border-top: 1px solid #e5e5e5; margin: 20px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>Solicitação Médica</h1>

  <div id="loading">Carregando...</div>

  <div id="infoSection" class="info" hidden>
    <p><strong>Paciente:</strong> <span id="nomePaciente"></span></p>
    <p><strong>OM:</strong> <span id="om"></span></p>
    <p><strong>Especialidades:</strong> <span id="especialidades"></span></p>
    <p><strong>Observação:</strong> <span id="observacao"></span></p>
  </div>

  <div id="errorSection" hidden></div>
  <div id="jaPreenchida" hidden>Esta solicitação já foi preenchida anteriormente.</div>

  <form id="triagemForm" hidden>
    <hr>
    <h2>Complete seus dados</h2>

    <label>CPF/PREC</label>
    <input type="text" id="cpfPrec" required>

    <label>Idade</label>
    <input type="number" id="idade" required min="0">

    <label>Telefone</label>
    <input type="text" id="telefone" required placeholder="(00) 00000-0000">

    <label>Clínica/Laboratório de preferência</label>
    <select id="clinicaLaboratorio" required disabled>
      <option value="">Carregando clínicas...</option>
    </select>

    <div class="checkbox-line">
      <input type="checkbox" id="aceitoTermos" required>
      <label for="aceitoTermos" style="margin:0; font-weight:normal;">Li e aceito os termos</label>
    </div>

    <button type="submit">Enviar</button>
  </form>

  <div id="resultSection" hidden>
    <h2 id="resultMensagem"></h2>
    <div id="opcoes"></div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  const loading = document.getElementById('loading');
  const infoSection = document.getElementById('infoSection');
  const errorSection = document.getElementById('errorSection');
  const jaPreenchida = document.getElementById('jaPreenchida');
  const triagemForm = document.getElementById('triagemForm');
  const resultSection = document.getElementById('resultSection');
  const clinicaSelect = document.getElementById('clinicaLaboratorio');

  async function carregarOcsPorEspecialidades(especialidades) {
    clinicaSelect.disabled = true;
    clinicaSelect.innerHTML = '<option value="">Carregando clínicas...</option>';

    if (!especialidades || especialidades.length === 0) {
      clinicaSelect.innerHTML = '<option value="">Especialidades da solicitação não encontradas</option>';
      return;
    }

    try {
      const query = especialidades.map(encodeURIComponent).join(',');
      const res = await fetch(`/api/ocs?especialidades=${query}`);
      const data = await res.json();

      if (data.length === 0) {
        clinicaSelect.innerHTML = '<option value="">Nenhuma clínica encontrada para as especialidades desta solicitação</option>';
        return;
      }

      clinicaSelect.innerHTML = '<option value="">Selecione a clínica...</option>';
      data.forEach(o => {
        const option = document.createElement('option');
        option.value = o.ocsId;
        const local = (o.ocsEnderecoCidade && o.ocsEnderecoUf) ? ` (${o.ocsEnderecoCidade}/${o.ocsEnderecoUf})` : '';
        option.textContent = `${o.ocsNome}${local}`;
        clinicaSelect.appendChild(option);
      });
      clinicaSelect.disabled = false;
    } catch (err) {
      clinicaSelect.innerHTML = '<option value="">Erro ao carregar clínicas</option>';
    }
  }

  async function carregarSolicitacao() {
    if (!token) {
      loading.hidden = true;
      errorSection.hidden = false;
      errorSection.textContent = 'Link inválido: token não informado.';
      return;
    }
    try {
      const res = await fetch(`/api/solicitacoes/publico/${token}`);
      const data = await res.json();
      loading.hidden = true;

      if (!res.ok) {
        errorSection.hidden = false;
        errorSection.textContent = data.error || 'Solicitação não encontrada.';
        return;
      }

      infoSection.hidden = false;
      document.getElementById('nomePaciente').textContent = data.nomePaciente;
      document.getElementById('om').textContent = data.om;
      document.getElementById('especialidades').textContent = (data.especialidades || []).join(', ');
      document.getElementById('observacao').textContent = data.observacao || '-';

      if (data.triagemPreenchida) {
        jaPreenchida.hidden = false;
      } else {
        triagemForm.hidden = false;
        carregarOcsPorEspecialidades(data.especialidades);
      }
    } catch (err) {
      loading.hidden = true;
      errorSection.hidden = false;
      errorSection.textContent = 'Erro ao carregar solicitação. Tente novamente.';
    }
  }

  triagemForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
      cpfPrec: document.getElementById('cpfPrec').value,
      idade: Number(document.getElementById('idade').value),
      telefone: document.getElementById('telefone').value,
      ocsId: Number(document.getElementById('clinicaLaboratorio').value),
      aceitoTermos: document.getElementById('aceitoTermos').checked
    };

    try {
      const res = await fetch(`/api/solicitacoes/publico/${token}/triagem`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok) {
        const msg = data.campos
          ? Object.entries(data.campos).map(([k, v]) => `${k}: ${v}`).join(' | ')
          : (data.error || 'Erro ao enviar');
        throw new Error(msg);
      }

      triagemForm.hidden = true;
      resultSection.hidden = false;
      document.getElementById('resultMensagem').textContent = data.mensagem;

      const opcoesDiv = document.getElementById('opcoes');
      opcoesDiv.innerHTML = '';
      (data.opcoes || []).forEach(o => {
        const div = document.createElement('div');
        div.className = 'opcao';
        div.innerHTML = `<strong>${o.tipo}</strong><br>${o.descricao}`;
        opcoesDiv.appendChild(div);
      });
    } catch (err) {
      alert(err.message);
    }
  });

  carregarSolicitacao();
</script>
</body>
</html>
