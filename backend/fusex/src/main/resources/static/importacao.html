<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUSEX - Importação de Dados</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 24px 16px;
    color: #222;
  }
  .container {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  h1 {
    font-size: 1.3em;
    margin-top: 0;
    color: #1a4d8f;
  }
  h2 {
    font-size: 0.95em;
    color: #1a4d8f;
    margin: 24px 0 10px;
    padding-bottom: 6px;
    border-bottom: 2px solid #e5e5e5;
  }
  label {
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
    font-size: 0.9em;
    font-weight: 600;
    color: #444;
  }
  input[type=text], input[type=password], input[type=file] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.95em;
  }
  .row2 { display: flex; gap: 12px; }
  .row2 > div { flex: 1; }
  button {
    margin-top: 12px;
    width: 100%;
    padding: 10px;
    background: #1a4d8f;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 1em;
    cursor: pointer;
  }
  button:hover { background: #143c70; }
  hr { border: none; border-top: 1px solid #e5e5e5; margin: 20px 0; }
  .bloco {
    padding: 14px;
    border-radius: 6px;
    margin-top: 10px;
    font-size: 0.85em;
  }
  .sucesso {
    background: #e7f6ec;
    border: 1px solid #a7dcb5;
    color: #1f7a3d;
  }
  .erro {
    background: #fdecea;
    border: 1px solid #f3b4ac;
    color: #a02b1f;
  }
  .aviso {
    margin-top: 4px;
    padding-left: 12px;
    color: #7a5c00;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Importação de Dados</h1>
  <p style="font-size:0.85em; color:#777; margin-top:-8px;">Atualiza o catálogo de procedimentos TUSS, os preços por OCS e o cadastro (CNPJ, endereço, telefone) das OCS já existentes.</p>

  <h2>Autenticação</h2>
  <div class="row2">
    <div>
      <label>Usuário</label>
      <input type="text" id="user" value="medico">
    </div>
    <div>
      <label>Senha</label>
      <input type="password" id="pass">
    </div>
  </div>

  <hr>

  <h2>Procedimentos TUSS</h2>
  <label>Planilha do Rol TUSS (.xls ou .xlsx)</label>
  <input type="file" id="arquivoTuss" accept=".xls,.xlsx">
  <button type="button" data-alvo="tuss">Importar TUSS</button>
  <div id="resultadoTuss"></div>

  <hr>

  <h2>Preços por OCS</h2>
  <label>Planilha de preços por OCS (.xls ou .xlsx)</label>
  <input type="file" id="arquivoOcsPrecos" accept=".xls,.xlsx">
  <button type="button" data-alvo="ocs-precos">Importar Preços</button>
  <div id="resultadoOcsPrecos"></div>

  <hr>

  <h2>Cadastro das OCS</h2>
  <label>Planilha com CNPJ, endereço e telefone (.xls ou .xlsx)</label>
  <input type="file" id="arquivoOcsCadastro" accept=".xls,.xlsx">
  <button type="button" data-alvo="ocs-cadastro">Importar Cadastro</button>
  <div id="resultadoOcsCadastro"></div>
</div>

<script>
  const inputs = {
    tuss: document.getElementById('arquivoTuss'),
    'ocs-precos': document.getElementById('arquivoOcsPrecos'),
    'ocs-cadastro': document.getElementById('arquivoOcsCadastro')
  };
  const resultados = {
    tuss: document.getElementById('resultadoTuss'),
    'ocs-precos': document.getElementById('resultadoOcsPrecos'),
    'ocs-cadastro': document.getElementById('resultadoOcsCadastro')
  };

  async function importar(alvo) {
    const arquivoInput = inputs[alvo];
    const resultado = resultados[alvo];
    resultado.innerHTML = '';

    if (!arquivoInput.files || arquivoInput.files.length === 0) {
      resultado.innerHTML = '<div class="bloco erro">Selecione um arquivo</div>';
      return;
    }

    const user = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;

    const formData = new FormData();
    formData.append('arquivo', arquivoInput.files[0]);

    try {
      const res = await fetch(`/api/importacao/${alvo}`, {
        method: 'POST',
        headers: { 'Authorization': 'Basic ' + btoa(user + ':' + pass) },
        body: formData
      });
      const data = await res.json();

      if (!res.ok) {
        resultado.innerHTML = `<div class="bloco erro">${data.error || 'Erro ao importar'}</div>`;
        return;
      }

      let html = `<div class="bloco sucesso">${data.mensagem}</div>`;
      (data.avisos || []).forEach(aviso => {
        html += `<div class="aviso">${aviso}</div>`;
      });
      resultado.innerHTML = html;
    } catch (err) {
      resultado.innerHTML = '<div class="bloco erro">Erro ao importar. Tente novamente.</div>';
    }
  }

  document.querySelectorAll('button[data-alvo]').forEach(btn => {
    btn.addEventListener('click', () => importar(btn.dataset.alvo));
  });
</script>
</body>
</html>
