<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUSEX</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 24px 16px;
    color: #222;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
  }
  .container {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border-radius: 8px;
    padding: 32px 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    text-align: center;
  }
  h1 { color: #1a4d8f; margin-top: 0; }
  p { color: #666; font-size: 0.9em; }
  a.btn {
    display: block;
    margin-top: 16px;
    padding: 12px;
    background: #1a4d8f;
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    font-weight: 600;
  }
  a.btn:hover { background: #143c70; }
  .hint {
    margin-top: 24px;
    font-size: 0.8em;
    color: #999;
  }
</style>
</head>
<body>
<div class="container">
  <h1>FUSEX</h1>
  <p>Sistema de Solicitação Médica</p>
  <a class="btn" href="medico.html">Acessar como Médico</a>
  <p class="hint">O beneficiário acessa por um link específico enviado pelo médico após criar a solicitação.</p>
