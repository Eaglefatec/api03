<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUSEX - Nova Solicitação Médica</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 24px 16px;
    color: #222;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  h1 {
    font-size: 1.3em;
    margin-top: 0;
    color: #1a4d8f;
  }
  h2 {
    font-size: 1em;
    color: #555;
    margin-top: 24px;
  }
  label {
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
    font-size: 0.9em;
    font-weight: 600;
    color: #444;
  }
  input[type=text], input[type=number], input[type=password], textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.95em;
  }
  textarea { resize: vertical; min-height: 60px; }
  .especialidades {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .especialidades label {
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: normal;
    margin: 0;
    background: #f0f2f5;
    padding: 6px 10px;
    border-radius: 16px;
    cursor: pointer;
    font-size: 0.85em;
  }
  .especialidades input { margin: 0; }
  .procedimento-wrap { position: relative; }
  #procedimentoSugestoes {
    list-style: none;
    margin: 0;
    padding: 0;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid #ccc;
    border-top: none;
    border-radius: 0 0 4px 4px;
    max-height: 200px;
    overflow-y: auto;
    z-index: 10;
  }
  #procedimentoSugestoes li {
    padding: 8px 10px;
    cursor: pointer;
    font-size: 0.9em;
    border-bottom: 1px solid #f0f0f0;
  }
  #procedimentoSugestoes li:hover { background: #f0f4ff; }
  .procedimento-linha { display: flex; gap: 8px; align-items: flex-end; }
  .procedimento-linha > div:first-child { flex: 1; }
  .procedimento-linha input[type=number] { width: 80px; }
  #listaProcedimentos {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
  }
  #listaProcedimentos li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f0f4ff;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 0.85em;
  }
  #listaProcedimentos button {
    margin: 0;
    width: auto;
    padding: 2px 8px;
    background: #c0392b;
    font-size: 0.85em;
  }
  #listaProcedimentos button:hover { background: #a02b1f; }
  #addProcedimentoBtn {
    margin-top: 0;
    width: auto;
    padding: 8px 14px;
  }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    background: #1a4d8f;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 1em;
    cursor: pointer;
  }
  button:hover { background: #143c70; }
  .row2 { display: flex; gap: 12px; }
  .row2 > div { flex: 1; }
  #result, #errorMsg {
    margin-top: 20px;
    padding: 12px;
    border-radius: 6px;
    font-size: 0.9em;
  }
  #result {
    background: #e7f6ec;
    border: 1px solid #a7dcb5;
  }
  #errorMsg {
    background: #fdecea;
    border: 1px solid #f3b4ac;
    color: #a02b1f;
  }
  #linkOutput {
    width: 100%;
    padding: 8px;
    margin-top: 8px;
    font-size: 0.85em;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
  }
  #copyBtn {
    margin-top: 8px;
    background: #2f9e58;
  }
  #copyBtn:hover { background: #257e46; }
  hr { border: none; border-top: 1px solid #e5e5e5; margin: 20px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>Nova Solicitação Médica</h1>

  <h2>Autenticação</h2>
  <div class="row2">
    <div>
      <label>Usuário</label>
      <input type="text" id="user" value="medico">
    </div>
    <div>
      <label>Senha</label>
      <input type="password" id="pass">
    </div>
  </div>

  <hr>

  <form id="solicitacaoForm">
    <label>ID do Médico</label>
    <input type="number" id="medicoId" value="1" required>

    <label>Nome do Paciente</label>
    <input type="text" id="nomePaciente" required>

    <div class="row2">
      <div>
        <label>OM</label>
        <input type="text" id="om" required>
      </div>
      <div>
        <label>CPF/PREC</label>
        <input type="text" id="cpfPrec" required>
      </div>
    </div>

    <label>Especialidades</label>
    <div class="especialidades">
      <label><input type="checkbox" class="especialidade" value="CARDIOLOGISTA"> Cardiologista</label>
      <label><input type="checkbox" class="especialidade" value="ORTOPEDISTA"> Ortopedista</label>
      <label><input type="checkbox" class="especialidade" value="ENDOCRINOLOGISTA"> Endocrinologista</label>
      <label><input type="checkbox" class="especialidade" value="GINECOLOGISTA_OBSTETRA"> Ginecologista/Obstetra</label>
      <label><input type="checkbox" class="especialidade" value="NUTRICIONISTA"> Nutricionista</label>
      <label><input type="checkbox" class="especialidade" value="PSIQUIATRA"> Psiquiatra</label>
      <label><input type="checkbox" class="especialidade" value="DERMATOLOGISTA"> Dermatologista</label>
      <label><input type="checkbox" class="especialidade" value="OUTROS"> Outros</label>
    </div>

    <label>Procedimentos</label>
    <div class="procedimento-linha">
      <div class="procedimento-wrap">
        <input type="text" id="procedimentoBusca" placeholder="Digite o nome do procedimento (min. 3 letras)..." autocomplete="off">
        <ul id="procedimentoSugestoes" hidden></ul>
      </div>
      <div>
        <input type="number" id="procedimentoQuantidade" min="1" value="1">
      </div>
      <button type="button" id="addProcedimentoBtn">Adicionar</button>
    </div>
    <ul id="listaProcedimentos"></ul>

    <label>Observação (opcional)</label>
    <textarea id="observacao"></textarea>

    <button type="submit">Criar Solicitação</button>
  </form>

  <div id="result" hidden>
    <strong>✅ Solicitação criada!</strong>
    <p>Envie este link ao beneficiário:</p>
    <input type="text" id="linkOutput" readonly>
    <button id="copyBtn" type="button">Copiar link</button>
  </div>

  <div id="errorMsg" hidden></div>
</div>

<script>
  const form = document.getElementById('solicitacaoForm');
  const resultBox = document.getElementById('result');
  const errorBox = document.getElementById('errorMsg');
  const linkOutput = document.getElementById('linkOutput');

  const procedimentoBusca = document.getElementById('procedimentoBusca');
  const procedimentoSugestoes = document.getElementById('procedimentoSugestoes');
  const procedimentoQuantidade = document.getElementById('procedimentoQuantidade');
  const addProcedimentoBtn = document.getElementById('addProcedimentoBtn');
  const listaProcedimentos = document.getElementById('listaProcedimentos');

  let procedimentoSelecionadoAtual = null;
  let procedimentosAdicionados = [];
  let debounceTimer = null;

  procedimentoBusca.addEventListener('input', () => {
    procedimentoSelecionadoAtual = null;
    clearTimeout(debounceTimer);
    const texto = procedimentoBusca.value.trim();

    if (texto.length < 3) {
      procedimentoSugestoes.hidden = true;
      procedimentoSugestoes.innerHTML = '';
      return;
    }

    debounceTimer = setTimeout(async () => {
      try {
        const res = await fetch('/api/procedimentos?busca=' + encodeURIComponent(texto));
        const data = await res.json();
        procedimentoSugestoes.innerHTML = '';
        if (data.length === 0) {
          procedimentoSugestoes.hidden = true;
          return;
        }
        data.forEach(p => {
          const li = document.createElement('li');
          li.textContent = p.procDescricao;
          li.addEventListener('click', () => {
            procedimentoSelecionadoAtual = p;
            procedimentoBusca.value = p.procDescricao;
            procedimentoSugestoes.hidden = true;
          });
          procedimentoSugestoes.appendChild(li);
        });
        procedimentoSugestoes.hidden = false;
      } catch (err) {
        procedimentoSugestoes.hidden = true;
      }
    }, 300);
  });

  addProcedimentoBtn.addEventListener('click', () => {
    if (!procedimentoSelecionadoAtual) {
      errorBox.textContent = 'Selecione um procedimento da lista de sugestões antes de adicionar.';
      errorBox.hidden = false;
      return;
    }
    const quantidade = Number(procedimentoQuantidade.value) || 1;
    procedimentosAdicionados.push({
      procedimentoCodigoDgp: procedimentoSelecionadoAtual.procCodigoDgp,
      procDescricao: procedimentoSelecionadoAtual.procDescricao,
      quantidade: quantidade
    });
    renderListaProcedimentos();

    procedimentoBusca.value = '';
    procedimentoQuantidade.value = 1;
    procedimentoSelecionadoAtual = null;
    errorBox.hidden = true;
  });

  function renderListaProcedimentos() {
    listaProcedimentos.innerHTML = '';
    procedimentosAdicionados.forEach((p, index) => {
      const li = document.createElement('li');
      const span = document.createElement('span');
      span.textContent = `${p.procDescricao} (qtd: ${p.quantidade})`;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = 'Remover';
      btn.addEventListener('click', () => {
        procedimentosAdicionados.splice(index, 1);
        renderListaProcedimentos();
      });
      li.appendChild(span);
      li.appendChild(btn);
      listaProcedimentos.appendChild(li);
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.hidden = true;
    resultBox.hidden = true;

    const user = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;
    const especialidades = Array.from(document.querySelectorAll('.especialidade:checked')).map(el => el.value);

    if (especialidades.length === 0) {
      errorBox.textContent = 'Selecione ao menos uma especialidade.';
      errorBox.hidden = false;
      return;
    }

    if (procedimentosAdicionados.length === 0) {
      errorBox.textContent = 'Adicione ao menos um procedimento.';
      errorBox.hidden = false;
      return;
    }

    const payload = {
      medicoId: Number(document.getElementById('medicoId').value),
      nomePaciente: document.getElementById('nomePaciente').value,
      om: document.getElementById('om').value,
      cpfPrec: document.getElementById('cpfPrec').value,
      especialidades: especialidades,
      observacao: document.getElementById('observacao').value,
      procedimentos: procedimentosAdicionados.map(p => ({
        procedimentoCodigoDgp: p.procedimentoCodigoDgp,
        quantidade: p.quantidade
      }))
    };

    try {
      const res = await fetch('/api/solicitacoes', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json; charset=UTF-8',
          'Authorization': 'Basic ' + btoa(user + ':' + pass)
        },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (!res.ok) {
        const msg = data.campos
          ? Object.entries(data.campos).map(([k, v]) => `${k}: ${v}`).join(' | ')
          : (data.error || 'Erro ao criar solicitação');
        throw new Error(msg);
      }

      const beneficiarioLink = window.location.origin + '/api/beneficiario.html?token=' + data.tokenPublico;
      linkOutput.value = beneficiarioLink;
      resultBox.hidden = false;
      form.reset();
      procedimentosAdicionados = [];
      renderListaProcedimentos();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.hidden = false;
    }
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    linkOutput.select();
    navigator.clipboard.writeText(linkOutput.value).then(() => {
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = 'Copiado!';
      setTimeout(() => { btn.textContent = original; }, 1500);
    });
  });
</script>
</body>
</html>
